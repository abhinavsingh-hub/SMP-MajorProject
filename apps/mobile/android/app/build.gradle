apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

def jscFlavor = 'io.github.react-native-community:jsc-android:+'
def releaseSigningProperties = new Properties()
def releaseSigningFile = new File(System.getProperty('user.home'), '.gradle/gradle.properties')
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}
def requiredSigningKeys = ['SOCIALPARSE_RELEASE_STORE_FILE', 'SOCIALPARSE_RELEASE_STORE_PASSWORD', 'SOCIALPARSE_RELEASE_KEY_ALIAS', 'SOCIALPARSE_RELEASE_KEY_PASSWORD']
def releaseSigningReady = requiredSigningKeys.every { releaseSigningProperties.getProperty(it) }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.socialparse.mobile"
    defaultConfig {
        applicationId "com.socialparse.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseSigningReady) {
                storeFile file(releaseSigningProperties.getProperty('SOCIALPARSE_RELEASE_STORE_FILE'))
                storePassword releaseSigningProperties.getProperty('SOCIALPARSE_RELEASE_STORE_PASSWORD')
                keyAlias releaseSigningProperties.getProperty('SOCIALPARSE_RELEASE_KEY_ALIAS')
                keyPassword releaseSigningProperties.getProperty('SOCIALPARSE_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (!releaseSigningReady && taskGraph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        throw new GradleException("Release signing is not configured. Add the SOCIALPARSE_RELEASE_* keys to ~/.gradle/gradle.properties.")
    }
}

// Enforce JDK 17 for Gradle toolchain
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
