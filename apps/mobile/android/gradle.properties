# Gradle JVM and memory settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Android and React Native flags
android.useAndroidX=true
android.enableJetifier=true
newArchEnabled=true
hermesEnabled=true

# JDK 17 toolchain enforcement
# If JAVA_HOME is not set globally, you can uncomment and point org.gradle.java.home to your JDK 17 path:
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-17.0.3.jdk/Contents/Home
